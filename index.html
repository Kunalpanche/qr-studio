<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0b1020"/><title>QR Studio — Free Forever</title><style>
/* One preview coordinate system: its side is the smaller measured canvas axis. */
.board{container-type:size}
.qr{--preview-side:min(calc(100cqw - 56px),calc(100cqh - 56px));width:var(--preview-side)!important;height:var(--preview-side)!important;max-width:none!important;max-height:none!important;aspect-ratio:1/1;overflow:hidden;line-height:0;isolation:isolate;flex:none}
.qr>img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;vertical-align:middle}
@media(max-width:620px){.qr{--preview-side:min(calc(100cqw - 35px),calc(100cqh - 35px))}}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
